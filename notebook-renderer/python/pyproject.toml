[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "notebook-renderer"
version = "1.0.0a1"
description = "Render Markdown, Mermaid diagrams, and Math onto realistic notebook paper with hand-drawn aesthetics"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
keywords = ["markdown", "mermaid", "renderer", "notebook", "handwritten", "image"]
requires-python = ">=3.8"
dependencies = [
    "playwright>=1.40.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
notebook-renderer = "notebook_renderer:main"

[project.urls]
Homepage = "https://github.com/yourusername/notebook-renderer"
Repository = "https://github.com/yourusername/notebook-renderer.git"
Issues = "https://github.com/yourusername/notebook-renderer/issues"

[tool.setuptools.packages.find]
where = ["python"]

[tool.setuptools.package-data]
notebook_renderer = ["_assets/*.html"]

[tool.black]
line-length = 88
target-version = ['py38']

[tool.ruff]
line-length = 88
select = ["E", "F", "W", "I"]
